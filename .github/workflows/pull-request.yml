name: NetDevPack - MAIN PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore src/NetDevPack.Fido2.sln

      - name: Build
        run: dotnet build src/NetDevPack.Fido2.sln --no-restore -c Release

      - name: Test
        run: dotnet test --solution src/NetDevPack.Fido2.sln --no-build -c Release

      - name: Check vulnerable packages
        run: |
          dotnet list src/NetDevPack.Fido2.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
